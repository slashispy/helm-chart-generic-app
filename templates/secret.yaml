{{- if .Values.env.secret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-app.secretName" . }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.env.secret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
